name: CI - Bloco 2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    name: Build e Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências e verificar sintaxe
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          find src -name '*.js' -exec node --check {} \;
          npm test
      - name: Instalar Semgrep
        run: python -m pip install 'semgrep==1.183.0'
      - name: SAST - bloquear achados ERROR e WARNING
        run: >-
          semgrep scan --config p/javascript
          --severity ERROR --severity WARNING
          --error --strict --metrics off --disable-version-check app/src
